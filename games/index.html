<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitty and Sheep</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #fef6fb 0%, #fff 50%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 { color: #c0392b; font-size: 2em; margin-bottom: 6px; }
        .subtitle { color: #999; margin-bottom: 24px; font-size: 0.85em; }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            margin-bottom: 18px;
        }
        .btn {
            border: none;
            padding: 14px 36px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s;
            text-decoration: none;
            color: white;
            display: inline-block;
        }
        .btn-together {
            background: linear-gradient(135deg, #ff6b81, #ee5a6f);
            font-size: 1.15em;
            padding: 16px 40px;
        }
        .btn-solo {
            background: #eee;
            color: #888;
            font-size: 0.85em;
            padding: 8px 24px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }
        .divider {
            color: #ccc;
            font-size: 0.78em;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <h1>🐱 Kitty & Sheep 🐑</h1>
    <p class="subtitle">for Kimmie and Harry</p>

    <div class="buttons">
        <a href="kitty-and-sheep.html" class="btn btn-together">🤗 Play with Kitty and Sheep</a>
    </div>

    <div class="divider">— or —</div>

    <div class="buttons">
        <a href="cat.html" class="btn btn-solo">🐱 Kitty</a>
        <a href="sheep.html" class="btn btn-solo">🐑 Sheep</a>
    </div>

</body>
</html>
