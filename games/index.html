<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitty and Sheep Games</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .game-option {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
            display: inline-block;
        }

        .game-option.together {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 40%, #11998e 100%);
            padding: 18px 36px;
            font-size: 1.35em;
        }
        
        .game-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .game-option:active {
            transform: translateY(1px);
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .kitty-sheep {
            font-size: 3em;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kitty and Sheep Games</h1>
        <div class="kitty-sheep">🐱🐑</div>
        <p class="subtitle">Choose your adventure!</p>

        <button class="game-option together" onclick="location.href='kitty-and-sheep.html'">🐱 Play with Kitty and Sheep 🐑</button>

        <div style="margin: 18px 0; color: #aaa;">— or play separately —</div>

        <button class="game-option" onclick="location.href='cat.html'">🐱 Kitty Only</button>
        <button class="game-option" onclick="location.href='sheep.html'">🐑 Sheep Only</button>
    </div>
</body>
</html>
