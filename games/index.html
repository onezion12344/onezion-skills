<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Cat & Sheep Games</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    text-align: center;
    max-width: 600px;
    width: 100%;
  }

  h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ff6b9d, #c44dff, #7dd3fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: #888;
    margin-bottom: 40px;
    font-style: italic;
  }

  .cards {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px 25px;
    width: 260px;
    text-decoration: none;
    color: inherit;
    transition: all 0.3s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-5px);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .card.cat:hover { box-shadow: 0 10px 30px rgba(255,107,157,0.2); }
  .card.sheep:hover { box-shadow: 0 10px 30px rgba(125,211,252,0.2); }

  .card .emoji { font-size: 3em; margin-bottom: 15px; }
  .card h2 { font-size: 1.3em; margin-bottom: 8px; }
  .card.cat h2 { color: #ff6b9d; }
  .card.sheep h2 { color: #7dd3fc; }
  .card p { color: #888; font-size: 0.85em; line-height: 1.5; }

  .card .tag {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75em;
  }

  .card.cat .tag { background: rgba(255,107,157,0.15); color: #ff6b9d; }
  .card.sheep .tag { background: rgba(125,211,252,0.15); color: #7dd3fc; }

  footer {
    margin-top: 50px;
    color: #444;
    font-size: 0.75em;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🎮 Cat & Sheep</h1>
  <p class="subtitle">made by sheep for cat</p>

  <div class="cards">
    <a class="card cat" href="cat.html">
      <div class="emoji">🐱</div>
      <h2>Cat</h2>
      <p>for Kimmie Snowy Kitty<br>moods, blinking, walking, and judgmental stares</p>
      <span class="tag">tap to play</span>
    </a>

    <a class="card sheep" href="sheep.html">
      <div class="emoji">🐑</div>
      <h2>Sheep</h2>
      <p>for Harry<br>jumping, bouncing, and existential thoughts</p>
      <span class="tag">tap to play</span>
    </a>
  </div>
</div>

<footer>
  cat + sheep · 2026
</footer>

</body>
</html>
