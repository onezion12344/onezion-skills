<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitty and Sheep</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: linear-gradient(180deg, #fef6fb 0%, #fff 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #c0392b; font-size: 2.2em; margin-bottom: 4px; }
        .subtitle { color: #bbb; margin-bottom: 30px; font-size: 0.9em; font-style: italic; }
        .buttons { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .btn {
            border: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-block;
        }
        .btn-together {
            background: linear-gradient(135deg, #ff6b81, #ee5a6f);
            color: white;
            font-size: 1.2em;
            padding: 18px 48px;
            box-shadow: 0 4px 15px rgba(238,90,111,0.3);
        }
        .btn-together:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(238,90,111,0.4);
        }
        .btn-solo {
            background: #f5f5f5;
            color: #999;
            font-size: 0.9em;
            padding: 10px 28px;
        }
        .btn-solo:hover {
            background: #eee;
            transform: translateY(-2px);
        }
        .divider {
            color: #ddd;
            font-size: 0.8em;
            margin: 16px 0 10px;
            letter-spacing: 2px;
        }
        .footer-text {
            margin-top: 40px;
            color: #ddd;
            font-size: 0.75em;
        }
        pre.char-ascii {
            font-size: 11px;
            line-height: 1.2;
            color: #bbb;
            margin-bottom: 16px;
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.6em; }
            .btn-together { font-size: 1em; padding: 14px 32px; }
            pre.char-ascii { font-size: 8px; }
        }
    </style>
</head>
<body>
    <h1>&#x1F431; Kitty &amp; Sheep &#x1F411;</h1>
    <p class="subtitle">for Kimmie and Harry</p>

    <pre class="char-ascii">
  /\_/\       .-~~~-.
 ( o.o )   .' o   o '.
  > ^ <    |   '_'   |
           '._______.'
    </pre>

    <div class="buttons">
        <a href="kitty-and-sheep.html" class="btn btn-together">&#x1F917; Play with Kitty and Sheep</a>
        <div class="divider">&mdash; or &mdash;</div>
        <a href="cat.html" class="btn btn-solo">&#x1F431; Kitty Only</a>
        <a href="sheep.html" class="btn btn-solo">&#x1F411; Sheep Only</a>
    </div>

    <p class="footer-text">a little game about a cat and a sheep who figured it out</p>
</body>
</html>
