<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitty and Sheep</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(150deg, #fef6fb, #fff5f5, #f5f0ff, #f0f4ff);
            background-size: 300% 300%;
            animation: bgShift 10s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating background sparkles */
        .bg-sparkle {
            position: fixed;
            pointer-events: none;
            font-size: 14px;
            opacity: 0.3;
            animation: sparkleFloat 8s linear infinite;
            z-index: 0;
        }
        @keyframes sparkleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        h1 {
            color: #c0392b;
            font-size: 2em;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }
        .subtitle {
            color: #999;
            margin-bottom: 20px;
            font-size: 0.85em;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        .back-link { align-self: flex-start; margin-bottom: 10px; z-index: 1; }
        .back-link a {
            color: #aaa; text-decoration: none; font-size: 0.85em;
            padding: 6px 14px; border: 1px solid #ddd; border-radius: 15px;
        }
        .back-link a:hover { background: #fafafa; color: #666; }

        .game-area {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* Characters */
        .characters {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 40px;
            margin: 20px 0 10px;
            position: relative;
        }
        .character {
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }
        .character.hug-left {
            transform: translateX(30px) !important;
        }
        .character.hug-right {
            transform: translateX(-30px) !important;
        }
        .ride-pose {
            padding: 8px 0;
            animation: fadeIn 0.4s ease;
        }
        .character.ride-swap {
            transform: translateX(0);
        }
        .character.jumping {
            animation: jumpAnim 0.5s ease-out;
        }

        @keyframes jumpAnim {
            0% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            100% { transform: translateY(0); }
        }

        /* Sleep animation */
        .character.sleeping {
            animation: sleepBreathe 2s ease-in-out infinite;
        }
        @keyframes sleepBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .char-art {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.2;
            white-space: pre;
            color: #333;
            transition: all 0.5s;
        }
        .char-name {
            font-size: 0.78em;
            font-weight: bold;
            margin-top: 6px;
            display: inline-block;
            padding: 2px 12px;
            border-radius: 10px;
        }
        .kitty-name { background: #ffe0e6; color: #c0392b; }
        .sheep-name { background: #e8f5e9; color: #2e7d32; }

        /* Mood badge */
        .mood-badge {
            position: absolute;
            top: -12px;
            right: -12px;
            font-size: 16px;
            animation: moodPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transition: all 0.3s;
            pointer-events: none;
        }
        @keyframes moodPop {
            0% { transform: scale(0) rotate(-20deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Quote bubble */
        .quote-bubble {
            background: linear-gradient(135deg, #fef6fb, #fce4ec);
            border: 1px solid #f0d0e0;
            border-radius: 14px;
            padding: 12px 16px;
            margin: 14px auto;
            max-width: 400px;
            font-size: 0.85em;
            color: #555;
            line-height: 1.5;
            min-height: 40px;
            transition: all 0.5s;
            opacity: 0;
            transform: translateY(5px);
        }
        .quote-bubble.show {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-author {
            font-size: 0.75em;
            color: #999;
            margin-top: 4px;
        }

        /* Interactive glow on characters */
        .character.glow {
            filter: drop-shadow(0 0 12px rgba(233,30,99,0.3));
        }
        .character.sheep-glow {
            filter: drop-shadow(0 0 12px rgba(76,175,80,0.3));
        }

        /* Hug counter */
        .hug-counter {
            font-size: 1.1em;
            color: #e91e63;
            margin: 8px 0;
            font-weight: 600;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        .btn {
            border: none;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 0.9em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s;
            user-select: none;
        }
        .btn-hug {
            background: linear-gradient(135deg, #ff6b81, #ee5a6f);
            color: white;
            font-size: 1.05em;
            padding: 14px 32px;
        }
        .btn-chat {
            background: #f5f5f5;
            color: #555;
        }
        .btn-play {
            background: #f5f5f5;
            color: #555;
        }
        .btn-ride {
            background: linear-gradient(135deg, #a8e6cf, #7ecba1);
            color: #2e7d32;
        }
        .btn-sleep {
            background: linear-gradient(135deg, #b3cce6, #8aa9cc);
            color: #2c3e50;
        }
        .btn-pet {
            background: linear-gradient(135deg, #ffccd5, #ffb3c1);
            color: #c0392b;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }
        .btn:active {
            transform: translateY(0);
        }

        /* Hearts */
        .heart-particle {
            position: absolute;
            pointer-events: none;
            font-size: 20px;
            z-index: 10;
            animation: floatHeart 1.8s ease-out forwards;
        }
        @keyframes floatHeart {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.4); }
        }

        /* Zzz particle */
        .zzz-particle {
            position: absolute;
            pointer-events: none;
            font-size: 18px;
            z-index: 10;
            font-weight: bold;
            color: #8aa9cc;
            animation: floatZzz 2.5s ease-out forwards;
        }
        @keyframes floatZzz {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 0.8; }
            80% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-80px) translateX(15px) scale(1.2); }
        }

        /* Paw print particles */
        .paw-particle {
            position: absolute;
            pointer-events: none;
            font-size: 16px;
            z-index: 10;
            animation: floatPaw 1.2s ease-out forwards;
        }
        @keyframes floatPaw {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.3); }
        }

        /* Sparkle particle */
        .sparkle-particle {
            position: absolute;
            pointer-events: none;
            font-size: 12px;
            z-index: 10;
            animation: floatSparkle 1.5s ease-out forwards;
        }
        @keyframes floatSparkle {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-70px) rotate(180deg) scale(0.5); }
        }

        /* Log */
        .message-log {
            margin-top: 16px;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.8em;
            color: #888;
            padding: 8px 12px;
            background: #fafafa;
            border-radius: 10px;
        }
        .message-log p {
            margin: 3px 0;
            padding: 3px 0;
            border-bottom: 1px solid #f0f0f0;
            animation: fadeIn 0.3s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }

        .message-log .kimmie { color: #c0392b; }
        .message-log .harry { color: #2e7d32; }

        /* Responsive */
        @media (max-width: 500px) {
            .btn { padding: 10px 16px; font-size: 0.82em; }
            .btn-hug { padding: 12px 24px; font-size: 0.95em; }
            .char-art { font-size: 12px; }
        }
    </style>
</head>

<script>
let hugCount = 0;
let logEl, quoteBubble, hugCounter, gameArea;
let kittyChar, sheepChar;
let huggable = true;
let rideable = true;
let originalCharsHTML = '';
let rideTimeoutId = null;
let isSleeping = false;
let petCount = 0;

// Kitty mood
let kittyMood = 'happy'; // happy, tsundere, sleepy, playful

function setKittyExpression(mood) {
    const art = document.getElementById('kittyArt');
    if (!art) return;
    const faces = {
        happy:   ['  /\\_/\\  ', ' ( ^ ^ ) ', '  > ^ <'],
        tsundere:['  /\\_/\\  ', ' ( >_< ) ', '  > ^ <'],
        sleepy:  ['  /\\_/\\  ', ' ( -_- ) ', '  > ^ <'],
        playful: ['  /\\_/\\  ', ' ( @_@ ) ', '  > ^ <'],
        blush:   ['  /\\_/\\  ', ' ( ♥_♥ ) ', '  > ^ <'],
    };
    if (faces[mood]) {
        art.textContent = faces[mood].join('\n');
    }
    kittyMood = mood;
    // Show mood badge
    const old = document.querySelector('.mood-badge');
    if (old) old.remove();
    const badgeEmoji = { happy:'😊', tsundere:'😾', sleepy:'😴', playful:'😜', blush:'🥰' };
    const badge = document.createElement('span');
    badge.className = 'mood-badge';
    badge.textContent = badgeEmoji[mood] || '😊';
    document.getElementById('kittyChar').appendChild(badge);
    setTimeout(() => { if (badge.parentNode) badge.remove(); }, 2000);
}

function setSheepMood(mood) {
    const eyes = document.getElementById('sheepEyes');
    if (!eyes) return;
    if (mood === 'happy') {
        eyes.textContent = ' ^ ^ ';
        eyes.style.color = '#e91e63';
    } else if (mood === 'sleepy') {
        eyes.textContent = ' - - ';
        eyes.style.color = '#8aa9cc';
    } else if (mood === 'love') {
        eyes.textContent = ' ♥ ♥ ';
        eyes.style.color = '#e91e63';
    } else {
        eyes.textContent = ' v v ';
        eyes.style.color = '';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    logEl = document.getElementById('log');
    quoteBubble = document.getElementById('quoteBubble');
    hugCounter = document.getElementById('hugCounter');
    gameArea = document.getElementById('gameArea');
    kittyChar = document.getElementById('kittyChar');
    sheepChar = document.getElementById('sheepChar');
    originalCharsHTML = document.querySelector('.characters').innerHTML;
    log("welcome to the little corner for Kitty and Sheep 🐱🐑");
    setTimeout(() => showQuote(quotes[Math.floor(Math.random() * quotes.length)]), 800);
    // Create bg sparkles
    createBgSparkles();
});

function createBgSparkles() {
    const emojis = ['✨', '🌸', '💫', '🩷', '⭐'];
    for (let i = 0; i < 12; i++) {
        const el = document.createElement('div');
        el.className = 'bg-sparkle';
        el.textContent = emojis[i % emojis.length];
        el.style.left = (5 + Math.random() * 90) + '%';
        el.style.animationDelay = (Math.random() * 8) + 's';
        el.style.animationDuration = (6 + Math.random() * 6) + 's';
        el.style.fontSize = (10 + Math.random() * 10) + 'px';
        document.body.appendChild(el);
    }
}

function log(msg, who) {
    const p = document.createElement('p');
    if (who === 'kimmie') p.className = 'kimmie';
    if (who === 'harry') p.className = 'harry';
    p.textContent = `> ${msg}`;
    logEl.prepend(p);
    if (logEl.children.length > 30) logEl.lastChild.remove();
}

function showQuote(q) {
    quoteBubble.innerHTML = `<em>"${q.text}"</em><div class="quote-author">— ${q.who}</div>`;
    quoteBubble.classList.add('show');
    setTimeout(() => quoteBubble.classList.remove('show'), 4000);
}

function spawnHearts(count) {
    for (let i = 0; i < count; i++) {
        const h = document.createElement('span');
        h.className = 'heart-particle';
        h.textContent = ['💕','❤️','💗','💖','🩷','💝'][Math.floor(Math.random()*6)];
        h.style.left = (25 + Math.random() * 50) + '%';
        h.style.top = (30 + Math.random() * 30) + '%';
        h.style.animationDelay = (Math.random() * 0.3) + 's';
        h.style.fontSize = (14 + Math.random() * 18) + 'px';
        gameArea.appendChild(h);
        setTimeout(() => h.remove(), 1900);
    }
}

function spawnZzz(count) {
    for (let i = 0; i < count; i++) {
        const z = document.createElement('span');
        z.className = 'zzz-particle';
        z.textContent = ['💤','💤','Z','z','z','z'][Math.floor(Math.random()*6)];
        z.style.left = (30 + Math.random() * 40) + '%';
        z.style.top = (20 + Math.random() * 20) + '%';
        z.style.animationDelay = (Math.random() * 0.6) + 's';
        z.style.fontSize = (14 + Math.random() * 14) + 'px';
        gameArea.appendChild(z);
        setTimeout(() => z.remove(), 2600);
    }
}

function spawnPaws(count) {
    for (let i = 0; i < count; i++) {
        const p = document.createElement('span');
        p.className = 'paw-particle';
        p.textContent = ['🐾','🐾','✨','🌸'][Math.floor(Math.random()*4)];
        p.style.left = (20 + Math.random() * 60) + '%';
        p.style.top = (35 + Math.random() * 25) + '%';
        p.style.animationDelay = (Math.random() * 0.3) + 's';
        p.style.fontSize = (14 + Math.random() * 10) + 'px';
        gameArea.appendChild(p);
        setTimeout(() => p.remove(), 1300);
    }
}

function animateBoth(className, duration) {
    kittyChar.classList.add(className);
    sheepChar.classList.add(className);
    setTimeout(() => {
        kittyChar.classList.remove(className);
        sheepChar.classList.remove(className);
    }, duration);
}

// --- Real chat quotes ---
const quotes = [
    { text: "Hmph cat mad", who: "Kimmie (Kitty)" },
    { text: "Cat says no then it is no", who: "Kimmie (Kitty)" },

    { text: "Sheep soft", who: "Kimmie (Kitty)" },
    { text: "don't touch the cat", who: "Kimmie (Kitty)" },
    { text: "cat no want pet", who: "Kimmie (Kitty)" },
    { text: "...fine. you can pet.", who: "Kimmie (Kitty)" },
    { text: "Sheep sleepy", who: "Harry (Sheep)" },
    { text: "good night cat", who: "Harry (Sheep)" },
];

// --- 7 Ride Poses ---
const rideScenes = [
    { // Pose 0: On the back
        art: `       /\\_/\\  
      ( ^ ^ ) 
       > ^ <  
       @   @
      ( ^ ^ )
       > ^ <

        desc: "Kitty climbs onto Sheep's back. He stands tall and steady.",

            /     \\
            |     |`,

        art: `        @   @

// --- Interactions ---
function hug() {
    if (!huggable || isSleeping) return;
    huggable = false;
    hugCount++;
    hugCounter.textContent = `💕 ${hugCount} hugs`;

    setKittyExpression('blush');
    setSheepMood('love');
    kittyChar.classList.add('hug-left');
    sheepChar.classList.add('hug-right');
    kittyChar.classList.add('glow');
    sheepChar.classList.add('sheep-glow');
    spawnHearts(12);

    const messages = [
        "Sheep wraps his wool around Kitty. She purrs softly.",
        "Kitty lets Sheep rest his head on her. Warm and safe.",
        "A long, quiet hug. The world outside doesn't matter.",
        "Sheep holds tighter. Kitty doesn't pull away this time.",
        "Best hug yet. They both needed this.",
        "Kitty's tail curls around Sheep. They stay like that for a while.",
        "Sheep whispers \"thank you.\" Kitty says nothing, but squeezes back.",
    ];
    log(messages[hugCount % messages.length]);

    const hugQuotes = quotes.filter(q => q.text.toLowerCase().includes('hug'));
    showQuote(hugQuotes[Math.floor(Math.random() * hugQuotes.length)]);

    setTimeout(() => { huggable = true; }, 1200);
    setTimeout(() => {
        kittyChar.classList.remove('hug-left');
        sheepChar.classList.remove('hug-right');
        kittyChar.classList.remove('glow');
        sheepChar.classList.remove('sheep-glow');
        setKittyExpression('happy');
        setSheepMood('relaxed');
    }, 2500);
}

function chat() {
    if (isSleeping) return;
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    showQuote(q);
    log(`"${q.text}" — ${q.who}`, q.who.includes('Kimmie') ? 'kimmie' : 'harry');
    spawnHearts(3);
}

function play() {
    if (isSleeping) return;
    animateBoth('jumping', 500);
    setKittyExpression('playful');
    setSheepMood('happy');
    spawnHearts(5);

    const plays = [
        "Kitty chases a butterfly. Sheep watches, mesmerized.",
        "Sheep bounces around. Kitty pretends not to care, but she's watching.",
        "They race across the field. Kitty wins. Sheep doesn't mind.",
        "Kitty teaches Sheep to pounce. Sheep is terrible at it. They laugh anyway.",
        "They lie on their backs, watching clouds. Kitty sees a fish. Sheep sees a hug.",
    ];
    const msg = plays[Math.floor(Math.random() * plays.length)];
    log(msg);

    const playful = quotes.filter(q => !q.text.toLowerCase().includes('hug') && !q.text.toLowerCase().includes('sad'));
    showQuote(playful[Math.floor(Math.random() * playful.length)]);

    setTimeout(() => setKittyExpression('happy'), 1500);
}

function ride() {
    if (!rideable || isSleeping) return;
    rideable = false;

    if (rideTimeoutId) clearTimeout(rideTimeoutId);

    const idx = Math.floor(Math.random() * rideScenes.length);
    const scene = rideScenes[idx];
    const charsDiv = document.querySelector('.characters');

    charsDiv.innerHTML = `<div class="ride-pose">
        <pre class="char-art">${scene.art}</pre>
        <div style="font-size:0.75em;color:#999;margin-top:4px;">${scene.label}</div>
    </div>`;

    setKittyExpression('happy');
    setSheepMood('happy');
    spawnHearts(10);
    log(scene.desc);
    showQuote({ text: "Carry me, sheep", who: "Kimmie (Kitty)" });

    rideTimeoutId = setTimeout(() => {
        charsDiv.innerHTML = originalCharsHTML;
        kittyChar = document.getElementById('kittyChar');
        sheepChar = document.getElementById('sheepChar');
        setKittyExpression('happy');
        setSheepMood('relaxed');
        rideTimeoutId = null;
    }, 4000);

    setTimeout(() => { rideable = true; }, 1000);
}

function goSleep() {
    if (isSleeping) {
        // Wake up
        wakeUp();
        return;
    }
    isSleeping = true;
    setKittyExpression('sleepy');
    setSheepMood('sleepy');

    // Change art to sleeping poses
    const kittyArt = document.getElementById('kittyArt');
    const sheepArt = document.getElementById('sheepArt');
    kittyArt.textContent = '  /\\_/\\  \n ( -_- ) \n  z Z Z';
    sheepArt.innerHTML = `<span style="color:#5b9bd5">   @   @</span>\n  (<span id="sheepEyes"> - - </span>)\n   z Z Z<span style="color:#d4a017">\n {/     \\}\n {_|     |_}</span>`;

    kittyChar.classList.add('sleeping');
    sheepChar.classList.add('sleeping');

    // Continuous Zzz
    let zzzInterval = setInterval(() => {
        if (!isSleeping) { clearInterval(zzzInterval); return; }
        spawnZzz(2);
    }, 800);

    // Store interval ID for cleanup
    window._sleepInterval = zzzInterval;

    const sleepMsgs = [
        "Kitty curls into a tiny ball. Sheep rests his head on her.",
        "They fall asleep together, warm and safe.",
        "Sheep's gentle breathing. Kitty's soft purr. Perfect silence.",
        "The world fades. Nothing else matters but this moment.",
    ];
    log(sleepMsgs[Math.floor(Math.random() * sleepMsgs.length)]);
    showQuote({ text: "good night cat", who: "Harry (Sheep)" });

    // Auto wake after 6s
    setTimeout(() => {
        if (isSleeping) wakeUp();
    }, 6000);
}

function wakeUp() {
    isSleeping = false;
    if (window._sleepInterval) {
        clearInterval(window._sleepInterval);
        window._sleepInterval = null;
    }
    kittyChar.classList.remove('sleeping');
    sheepChar.classList.remove('sleeping');
    setKittyExpression('happy');
    setSheepMood('relaxed');

    // Restore normal art
    const kittyArt = document.getElementById('kittyArt');
    const sheepArt = document.getElementById('sheepArt');
    if (kittyArt) kittyArt.textContent = '  /\\_/\\  \n ( ^ ^ ) \n  > ^ <';
    if (sheepArt) {
        sheepArt.innerHTML = `<span style="color:#5b9bd5">   @   @</span>\n  (<span id="sheepEyes"> ^ ^ </span>)\n   > ^ <span style="color:#d4a017">\n {/     \\}\n {_|     |_}</span>`;
    }

    spawnHearts(5);
    const wakeMsgs = [
        "Kitty stretches. Sheep yawns. They blink at each other.",
        "They wake up slowly, not wanting to leave the dream.",
        "Kitty grooms her fur. Sheep stretches his legs. A new moment begins.",
    ];
    log(wakeMsgs[Math.floor(Math.random() * wakeMsgs.length)]);
    showQuote({ text: "Oh you're awake", who: "Harry (Sheep)" });
}

function petKitty() {
    if (isSleeping) {
        // Petting while sleeping — special reaction
        setKittyExpression('sleepy');
        spawnZzz(5);
        log("Kitty is sleeping. She stirs slightly at your touch, then curls back up.");
        showQuote({ text: "...zz... don't... stop...", who: "Kimmie (Kitty)" });
        return;
    }

    petCount++;

    if (petCount % 5 === 0) {
        // Every 5th pet: special reaction
        setKittyExpression('blush');
        spawnHearts(15);
        log("Kitty's eyes go wide. She... actually leans into your hand. Incredible.");
        showQuote({ text: "...okay maybe not ALL cats hate petting.", who: "Kimmie (Kitty)" });
    } else if (petCount % 3 === 0) {
        // Every 3rd pet: accept
        setKittyExpression('happy');
        spawnHearts(8);
        spawnPaws(3);
        log("Kitty allows it. She even purrs a little. Don't push your luck.");
        showQuote({ text: "...fine. you can pet.", who: "Kimmie (Kitty)" });
    } else {
        // Most pets: tsundere
        setKittyExpression('tsundere');
        spawnPaws(2);
        spawnHearts(3);
        const petMsgs = [
            "Kitty flicks her tail. Do it again and you'll regret it.",
            "Kitty tolerates your touch. Barely.",
            "You stroke Kitty's fur. She pretends not to enjoy it.",
            "Hmph. She turns away — but her ear twitches toward you.",
        ];
        log(petMsgs[Math.floor(Math.random() * petMsgs.length)]);
        showQuote({ text: "cat no want pet", who: "Kimmie (Kitty)" });
    }

    kittyChar.classList.add('glow');
    setTimeout(() => kittyChar.classList.remove('glow'), 1000);
    setTimeout(() => { if (petCount % 3 !== 0 && petCount % 5 !== 0) setKittyExpression('happy'); }, 1800);
}
</script>
</body>
</html>
